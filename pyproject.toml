[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "withnuri"
version = "0.1.0"
description = "A desktop companion app that shows a background-removed live pet overlay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "legojeon" }]
dependencies = [
  "pillow>=9.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.15",
]
ml = [
  "numpy>=1.26",
  "ultralytics>=8.3",
]
ui = [
  "PySide6>=6.7",
]
package = [
  "pyinstaller>=6.12",
]

[project.scripts]
withnuri = "withnuri.app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/withnuri"]
